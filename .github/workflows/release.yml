name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  register-terrakube:
    name: Register in Terrakube
    needs: goreleaser
    # Public Terrakube API is behind Cloudflare; GitHub-hosted runners get 1010 blocked.
    runs-on: johor-runners
    steps:
      - uses: actions/checkout@v4

      - name: Register provider in Terrakube registry
        env:
          TERRAKUBE_ENDPOINT: ${{ vars.TERRAKUBE_API_URL || 'https://terrakube-api.increbesco.net' }}
          TERRAKUBE_TOKEN: ${{ secrets.TERRAKUBE_API_TOKEN }}
          TERRAKUBE_ORGANIZATION: outpost
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/register_terrakube.py
